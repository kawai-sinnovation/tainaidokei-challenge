<!--
  たいないどけいチャレンジ（忘年会）
  1. Code.gs をスプレッドシートの Apps Script に貼り、setup を実行
  2. ウェブアプリとしてデプロイ（実行:自分 / アクセス:全員）
  3. 下の GAS_URL に末尾が /exec のURLを貼る
  4. Firebase Hosting にこのファイルを公開する
  会場スクリーンは ?admin=1 （設定してから「画面に映す」）
-->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #000000; color: #FFFFFF; min-height: 100%; }
  body {
    font-family: "DotGothic16", "MS Gothic", monospace;
    font-size: 18px;
    font-weight: 400;
    line-height: 1.55;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  button, input { font-family: inherit; font-weight: 400; font-size: inherit; color: #FFFFFF; background: #000000; }
  button { cursor: pointer; border-radius: 0; -webkit-appearance: none; appearance: none; touch-action: manipulation; }
  button:focus { outline: none; }
  button:focus-visible { outline: 2px solid #FACC15; outline-offset: 2px; }
  input {
    border: none;
    border-bottom: 2px solid #FFFFFF;
    border-radius: 0;
    -webkit-appearance: none;
    appearance: none;
    outline: none;
    padding: 4px 6px;
    width: 100%;
    font-size: 16px;
    caret-color: #FACC15;
  }
  input:focus { border-bottom-color: #FACC15; }
  input::placeholder { color: #737373; }
  .g { color: #FACC15; }
  .bad { color: #EF4444; }
  .logo { text-align: center; color: #FACC15; font-size: 28px; font-weight: 400; line-height: 1.35; letter-spacing: 1px; margin: 10px 0 14px; padding: 0 12px; }
  .stop {
    display: block;
    width: 100%;
    margin-top: 10px;
    padding: 18px 8px;
    background: #000000;
    color: #FACC15;
    border: 4px solid #FACC15;
    font-size: 32px;
    line-height: 1.2;
    text-align: center;
    letter-spacing: 0.12em;
  }
  .stop:active { color: #000000; background: #FACC15; }
  .sub { text-align: center; margin: -6px 0 14px; }
  .phone { max-width: 480px; margin: 0 auto; padding: 8px 12px 36px; }
  .screen { max-width: 1140px; margin: 0 auto; padding: 8px 16px 40px; }
  .wnd { position: relative; background: #000000; border: 4px solid #FFFFFF; padding: 4px; margin: 14px 0; }
  .wnd .in { border: 2px solid #FFFFFF; padding: 12px 14px; }
  .wnd .d { position: absolute; width: 8px; height: 8px; background: #FFFFFF; }
  .wnd .d.tl { top: -6px; left: -6px; }
  .wnd .d.tr { top: -6px; right: -6px; }
  .wnd .d.bl { bottom: -6px; left: -6px; }
  .wnd .d.br { bottom: -6px; right: -6px; }
  .wnd.gold { border-color: #FACC15; }
  .wnd.gold .in { border-color: #FACC15; }
  .wnd.gold .d { background: #FACC15; }
  .wnd.red { border-color: #EF4444; }
  .wnd.red .in { border-color: #EF4444; }
  .wnd.red .d { background: #EF4444; }
  .wnd.now { border-color: #FACC15; }
  .wnd.now .in { border-color: #FACC15; }
  .wnd.now .d { background: #FACC15; }
  .cap { position: absolute; top: -13px; left: 14px; background: #000000; color: #FACC15; padding: 0 6px; line-height: 1.2; z-index: 1; }
  .bl { animation: blink 0.7s steps(1, end) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .cmd { display: flex; align-items: center; width: 100%; min-height: 48px; padding: 6px 2px; background: transparent; border: none; text-align: left; font-size: 20px; line-height: 1.3; }
  .cmd:active { color: #FACC15; }
  .cmd:disabled { color: #737373; }
  .cur { display: inline-block; width: 1.25em; flex: none; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .cell { display: block; width: 100%; background: #000000; border: 2px solid #FFFFFF; padding: 4px 2px 5px; color: #FFFFFF; text-align: center; }
  .cell.sel { border-color: #FACC15; color: #FACC15; }
  .cell svg { width: 100%; height: auto; }
  .lb { display: flex; justify-content: center; align-items: center; font-size: 11px; line-height: 1.15; margin-top: 2px; }
  .nm.long { font-size: 8px; }
  .stat { display: flex; gap: 8px; align-items: center; margin: 8px 0; }
  .k { color: #FACC15; width: 4.2em; flex: none; }
  .hero { display: flex; gap: 12px; align-items: center; }
  .hero svg { width: 72px; height: 72px; flex: none; }
  .huge { color: #FACC15; font-size: 64px; line-height: 1; text-align: center; margin: 6px 0; }
  .runlabel { color: #FACC15; text-align: center; font-size: 28px; line-height: 1.2; margin: 4px 0 8px; }
  .stage { position: relative; height: 240px; margin: 0 0 8px; overflow: hidden; background: #000000; border: 2px solid #FFFFFF; }
  .walker { position: absolute; left: 0; top: 0; width: 72px; height: 72px; transform-origin: center center; }
  .walker.small { width: 48px; height: 48px; }
  .walker svg { width: 100%; height: 100%; display: block; }
  .msg { white-space: pre-wrap; min-height: 2.6em; }
  .note { margin-top: 8px; }
  .top { display: grid; grid-template-columns: 250px 1fr; gap: 12px; align-items: start; }
  .board { max-width: none; height: 100vh; padding: 4px 16px 8px; display: flex; flex-direction: column; overflow: hidden; }
  .logo.big { font-size: clamp(28px, 5.6vw, 84px); line-height: 1.15; margin: 4px 0 0; }
  .sub.big { font-size: clamp(18px, 3.6vw, 56px); margin: 2px 0 6px; }
  .board-row { flex: 1; min-height: 0; display: grid; grid-template-columns: 232px minmax(0, 1fr); gap: 12px; align-items: stretch; }
  .board.show .board-row { grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 48px; align-items: center; }
  .board.show .side { display: flex; flex-direction: column; justify-content: center; height: 100%; overflow: hidden; }
  .board.show .side .wnd .in { padding: 8px; }
  .board.show #qr { width: min(100%, calc(100vh - 220px)); height: auto; aspect-ratio: 1; margin: 4px auto; }
  .board.show #qr canvas, .board.show #qr img { width: 100% !important; height: auto !important; }
  .side { min-height: 0; overflow: auto; }
  .side .wnd { margin: 6px 0; }
  .side .wnd .in { padding: 6px 8px; }
  .goal { color: #FACC15; font-size: 36px; line-height: 1; }
  .party { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
  .board .party { height: 100%; min-height: 0; align-content: start; gap: 8px; }
  .board .party .wnd { margin: 0; }
  .board .party .wnd .in { padding: 4px 8px; display: flex; align-items: center; height: 100%; }
  .board .who svg { width: 40px; height: 40px; }
  .board .pname { font-size: 16px; }
  .board .party.dense .job { display: none; }
  .board .party.dense .who { gap: 6px; }
  .board .party.dense .who > div { display: flex; gap: 6px; align-items: baseline; min-width: 0; }
  .board .party.dense .who svg { width: 28px; height: 28px; }

  .who { display: flex; gap: 10px; align-items: center; }
  .who svg { width: 64px; height: 64px; flex: none; }
  .who.big { align-items: center; }
  .who.big svg { width: 112px; height: 112px; }
  .pname { font-size: 20px; overflow-wrap: anywhere; line-height: 1.3; }
  .who.big .pname { font-size: 28px; }
  .job { font-size: 14px; line-height: 1.3; }
  .num { font-size: 20px; }
  .who.big .num { font-size: 28px; }
  .stack { display: flex; flex-direction: column; gap: 8px; }
  .result-screen { max-width: none; height: 100vh; display: flex; flex-direction: column; overflow: hidden; padding: 8px 20px 16px; }
  .reveal { position: relative; flex: 1; min-height: 0; }
  .history { position: absolute; left: 0; top: 0; bottom: 0; width: 320px; display: flex; flex-direction: column; gap: 6px; overflow: hidden; }
  .history:empty { visibility: hidden; }
  .history .wnd { margin: 0; flex: 1 1 0; min-height: 0; overflow: hidden; }
  .history .wnd .in { padding: 4px 8px; height: 100%; display: flex; align-items: center; }

  .rankmark.long { font-size: 20px; }
  .rankmark.bad { color: #EF4444; }

  .who.mini .pname { font-size: 18px; white-space: nowrap; overflow: hidden; }
  .who.mini .num { font-size: 14px; }

  .stage-mid.versus-on .spot { order: 2; width: 100%; }

  .final .plain .who svg { width: 36px; height: 36px; }
  .final .plain .rankmark { font-size: 18px; min-width: 3.2em; }
  .final .plain .rankmark.long { font-size: 16px; min-width: 4.6em; }
  .final .plain .pname { font-size: 18px; }
  .duel { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: stretch; }

  #qr { background: #FFFFFF; width: 168px; height: 168px; margin: 8px auto; }
  #qr img, #qr canvas { display: block; }
  .url { word-break: break-all; font-size: 12px; line-height: 1.4; user-select: text; -webkit-user-select: text; text-align: center; }
  .center { text-align: center; }
  .step { display: flex; justify-content: center; gap: 12px; margin-top: 8px; }
  .step button { width: 72px; height: 48px; border: 2px solid #FFFFFF; font-size: 28px; line-height: 1; }
  .ops { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0 20px; }
  .ops button { min-height: 52px; border: 2px solid #FFFFFF; padding: 8px; font-size: 18px; }
  .ops button.main { border-color: #FACC15; color: #FACC15; }
  .sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); border: 0; }
  .gap { height: 8px; }
  body.flash { background: #FFFFFF; }
  body.flash #app { visibility: hidden; }
  svg { shape-rendering: crispEdges; }
  @media (max-width: 800px) {
    .top, .duel { grid-template-columns: 1fr; }
    .logo { font-size: 24px; }
    .huge { font-size: 52px; }
  }
  @media (max-width: 560px) {
    .board { height: auto; overflow: visible; }
    .board-row, .board.show .board-row { grid-template-columns: 1fr; }

  }

function useLocal() {

function esc(s) {

  });
}
function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function charBy(id) {

function svgOf(ch, size) {

      if (!p || p === ".") continue;
      rects += '<rect x="' + x + '" y="' + y + '" width="1" height="1" fill="' + (PAL[p] || "#FF00FF") + '"/>';
    }

  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="' + size + '" height="' + size + '" shape-rendering="crispEdges" role="img" aria-label="' + esc(ch.name) + '">' + rects + "</svg>";

function uid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function (c) {
    var r = Math.random() * 16 | 0;
    return (c === "x" ? r : (r & 0x3 | 0x8)).toString(16);
  });
}

/* ---------- 通信 ---------- */
function loadLocal() {
  try { return JSON.parse(localStorage.getItem(LS_KEY)) || { targetSec: 15, players: [] }; }
  catch (e) { return { targetSec: 15, players: [] }; }
}
function saveLocal(s) { localStorage.setItem(LS_KEY, JSON.stringify(s)); }

function localApi(p) {
  var s = loadLocal();
  if (!(s.targetSec >= 10 && s.targetSec <= 30)) s.targetSec = 15;
  var action = p.action || "list";
  function clock() {
    return { ok: true, targetSec: s.targetSec, gate: s.gate || "wait", goAt: s.goAt || 0, now: Date.now() };
  }
  if (action === "ping" || action === "config") return clock();
  if (action === "begin") {
    s.gate = "go";
    s.goAt = Date.now() + 5000;
    saveLocal(s);
    return clock();
  }
  if (action === "list") {
    var players = s.players.slice().sort(function (a, b) { return a.createdAt - b.createdAt; });
    var listed = clock();
    listed.players = players;
    return listed;
  }
  if (action === "setTarget") {
    var n = parseInt(p.targetSec, 10);
    if (!(n >= 10 && n <= 30)) return { ok: false, error: "range" };
    s.targetSec = n; saveLocal(s);
    return { ok: true, targetSec: n };
  }
  if (action === "entry") {
    var name = String(p.name || "").trim();
    var charId = parseInt(p.charId, 10);
    if (!name) return { ok: false, error: "name" };
    if (!(charId >= 0 && charId <= 19)) return { ok: false, error: "char" };
    var row = {
      id: uid(), name: Array.from(name).slice(0, 16).join(""), charId: charId, status: "ready",
      targetSec: s.targetSec, elapsedMs: null, errorMs: null, absErrorMs: null,
      createdAt: Date.now(), finishedAt: 0, dummy: false
    };
    s.players.push(row); saveLocal(s);
    return { ok: true, id: row.id, name: row.name, charId: row.charId, targetSec: row.targetSec };
  }
  if (action === "cancel") {
    s.players = s.players.filter(function (pl) { return !(pl.id === p.id && pl.status === "ready"); });
    saveLocal(s); return { ok: true };
  }
  if (action === "submit") {
    var pl = null;
    for (var i = 0; i < s.players.length; i++) if (s.players[i].id === p.id) pl = s.players[i];
    if (!pl) return { ok: false, error: "not found" };
    if (pl.status === "done" || pl.status === "fled") return { ok: true, duplicate: true, status: pl.status };
    var dq = String(p.dq) === "1";
    if (dq) {
      pl.status = "fled"; pl.finishedAt = Date.now(); saveLocal(s);
      return { ok: true, status: "fled" };
    }
    var elapsed = Math.round(Number(p.elapsedMs));
    if (!isFinite(elapsed) || elapsed < 0 || elapsed > 600000) return { ok: false, error: "bad time" };
    var target = parseInt(p.targetSec, 10);
    if (!(target >= 10 && target <= 30)) target = pl.targetSec;
    pl.status = "done"; pl.targetSec = target; pl.elapsedMs = elapsed;
    pl.errorMs = elapsed - target * 1000; pl.absErrorMs = Math.abs(pl.errorMs);
    pl.finishedAt = Date.now(); saveLocal(s);
    return { ok: true, status: "done" };
  }
  if (action === "dummies") {
    var now = Date.now();
    DUMMIES.forEach(function (d, i) {
      var done = d[2] !== null && d[2] !== undefined;
      var offset = done ? d[2] : null;
      s.players.push({
        id: uid(), name: d[0], charId: d[1], status: done ? "done" : "ready", targetSec: s.targetSec,
        elapsedMs: done ? s.targetSec * 1000 + offset : null,
        errorMs: done ? offset : null,
        absErrorMs: done ? Math.abs(offset) : null,
        createdAt: now + i, finishedAt: done ? now + i : 0, dummy: true
      });
    });
    saveLocal(s);
    return { ok: true, added: DUMMIES.length, targetSec: s.targetSec };
  }
  if (action === "reset") {
    s.players = []; s.gate = "wait"; s.goAt = 0; saveLocal(s); return { ok: true };
  }
  return { ok: false, error: "unknown" };
}

function jsonp(params) {
  return new Promise(function (resolve, reject) {
    var cb = "naidokei_cb_" + Math.random().toString(36).slice(2);
    var q = new URLSearchParams();
    Object.keys(params).forEach(function (k) {
      if (params[k] !== undefined && params[k] !== null) q.set(k, String(params[k]));
    });
    q.set("callback", cb);
    q.set("t", String(Date.now()));
    var sc = document.createElement("script");
    var timer = setTimeout(function () { cleanup(); reject(new Error("timeout")); }, 9000);
    function cleanup() { clearTimeout(timer); try { delete window[cb]; } catch (e) { window[cb] = undefined; } sc.remove(); }
    window[cb] = function (data) { cleanup(); resolve(data); };
    sc.onerror = function () { cleanup(); reject(new Error("jsonp")); };
    var join = GAS_URL.indexOf("?") >= 0 ? "&" : "?";
    sc.src = GAS_URL + join + q.toString();
    document.head.appendChild(sc);
  });
}

async function gas(params) {
  try {
    var res = await fetch(GAS_URL, {
      method: "POST",
      redirect: "follow",
      cache: "no-store",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(params)
    });
    var text = await res.text();
    var data = JSON.parse(text);
    if (!data || typeof data !== "object") throw new Error("bad");
    return data;
  } catch (e) {
    return jsonp(params);
  }
}

function api(params) {
  if (useLocal()) return Promise.resolve(localApi(params));
  return gas(params);
}

function tryBeacon(dq, id, elapsedMs, targetSec) {
  var payload = {
    action: "submit", id: id, dq: dq ? "1" : "0",
    elapsedMs: dq ? "" : Math.round(Number(elapsedMs)),
    targetSec: targetSec
  };
  if (useLocal()) { localApi(payload); return; }
  try {
    if (navigator.sendBeacon) navigator.sendBeacon(GAS_URL, JSON.stringify(payload));
  } catch (e) {}
}

function renderPlayer() {
  if (renderedPhase === player.phase) return;
  renderedPhase = player.phase;
  if (player.phase === "entry") paintEntry();
  else if (player.phase === "joined") paintJoined();
  else if (player.phase === "wait" || player.phase === "ready") paintReady();
  else if (player.phase === "running") paintRunning();
  else if (player.phase === "done") paintDone();
  else if (player.phase === "fled") paintFled();

function pickChar(i) {
  if (i < 0 || i >= CHARACTERS.length) return;
  selected = i;
  var input = document.getElementById("name");
  if (input) nameDraft = input.value;
  document.querySelectorAll(".cell").forEach(function (cell) {
    var on = Number(cell.dataset.i) === selected;
    cell.classList.toggle("sel", on);
    var cur = cell.querySelector(".cur");
    if (!cur) return;
    cur.style.visibility = on ? "visible" : "hidden";
    cur.classList.toggle("bl", on);
  });
  var label = document.getElementById("selname");
  if (label) label.textContent = CHARACTERS[selected].name;
  sfx.resume();
  sfx.pip();

async function onEntry(e) {
  e.preventDefault();
  if (entering) return;
  var input = document.getElementById("name");
  var name = input.value.trim();
  nameDraft = input.value;
  var em = document.getElementById("emsg");
  if (!name) { em.textContent = "なまえを いれて"; sfx.pip(); return; }
  entering = true;
  em.textContent = "";
  try {
    await sfx.resume();
    var r = await api({ action: "entry", name: name, charId: selected });
    if (!r || !r.ok) throw new Error("ng");
    sfx.levelUp();
    player.id = r.id; player.name = r.name || name; player.charId = r.charId;
    player.targetSec = r.targetSec || 15; player.phase = "joined";
    player.sendState = "idle"; player.elapsedMs = null;
    saveSession();
    entering = false;
    renderPlayer();
    refreshTarget();
  } catch (err) {
    entering = false;
    em.className = "bad";
    em.textContent = "つながらない。もういちど。";
  }
}

var wanderOn = false;
var wanderIds = [];
function stopWander() {
  wanderOn = false;
  for (var i = 0; i < wanderIds.length; i++) clearTimeout(wanderIds[i]);
  wanderIds = [];
}
function wanderLater(fn, ms) {
  if (!wanderOn) return;
  var id = setTimeout(function () {
    if (!wanderOn) return;
    fn();
  }, ms);
  wanderIds.push(id);
}
function startWander() {
  stopWander();
  wanderOn = true;
  ["walkerA", "walkerB"].forEach(function (id) {
    var el = document.getElementById(id);
    var stage = document.getElementById("stage");
    if (!el || !stage) return;
    var pad = id === "walkerB" ? 48 : 72;
    var x = Math.random() * 40;
    var y = 20 + Math.random() * 40;
    var face = 1;
    var spin = 0;
    function clamp(v, max) { return Math.max(0, Math.min(max, v)); }
    function paint(bob) {
      el.style.transform = "translate(" + Math.round(x) + "px," + Math.round(y - bob) + "px) scaleX(" + face + ") rotate(" + spin + "deg)";
    }
    function limits() {
      return {
        w: Math.max(8, stage.clientWidth - pad),
        h: Math.max(8, stage.clientHeight - pad)
      };
    }
    function next() {
      if (Math.random() < 0.62) walk();
      else spinBurst();
    }
    function walk() {
      var steps = 2 + Math.floor(Math.random() * 7);
      var dir = Math.random() < 0.5 ? -1 : 1;
      var hop = Math.random() < 0.35;
      face = dir;
      spin = 0;
      var i = 0;
      function step() {
        var b = limits();
        x = clamp(x + dir * (6 + Math.floor(Math.random() * 18)), b.w);
        if (hop || Math.random() < 0.3) y = clamp(y + (Math.random() < 0.5 ? -1 : 1) * (8 + Math.floor(Math.random() * 28)), b.h);
        paint(i % 2 ? 6 : 0);
        i++;
        if (i < steps) wanderLater(step, 70 + Math.random() * 180);
        else wanderLater(next, 120 + Math.random() * 860);
      }
      step();
    }
    function spinBurst() {
      var n = 2 + Math.floor(Math.random() * 7);
      var i = 0;
      function step() {
        spin = (spin + 90) % 360;
        if (Math.random() < 0.4) {
          var b = limits();
          x = clamp(x + (Math.random() - 0.5) * 36, b.w);
          y = clamp(y + (Math.random() - 0.5) * 36, b.h);
        }
        paint(0);
        i++;
        if (i < n) wanderLater(step, 60 + Math.random() * 150);
        else wanderLater(next, 80 + Math.random() * 640);
      }
      step();
    }
    paint(0);
    wanderLater(next, 80 + Math.random() * 400);
  });
}

function paintDone() {
  app.innerHTML = '<div class="phone"><h1 class="logo">体内時計<br>チャレンジ</h1>' +
    wnd("", '<div class="msg" id="doneMsg"></div><div id="sendNote" class="note"></div>') +
    "</div>";
  typeInto(document.getElementById("doneMsg"), player.name + "は じかんを とめた！\nけっかは スクリーンで発表される！");
}

function paintFled() {
  app.innerHTML = '<div class="phone"><h1 class="logo">体内時計<br>チャレンジ</h1>' +
    wnd("", '<div class="msg bad" id="doneMsg"></div><div id="sendNote" class="note"></div>', "red") +
    "</div>";
  typeInto(document.getElementById("doneMsg"), player.name + "は にげだした！（失格）");
}

function onStart() {
  if (player.phase !== "wait" && player.phase !== "ready") return;
  sfx.resume(); sfx.pip();
  player.phase = "running";
  player.t0 = performance.now();
  player.elapsedMs = null;
  player.sendState = "idle";
  saveSession();
  renderPlayer();
}

function onStop() {
  if (player.phase !== "running") return;
  var ms = performance.now() - player.t0;
  if (ms < 300) return;
  stopWander();
  sfx.hit(); buzz(40);
  player.elapsedMs = ms;
  player.phase = "done";
  player.sendState = "idle";
  saveSession();
  document.body.classList.add("flash");
  setTimeout(function () { document.body.classList.remove("flash"); }, 80);
  renderPlayer();
  sendResult(false);
}

async function onRedo() {
  sfx.pip();
  if (player.id) { try { await api({ action: "cancel", id: player.id }); } catch (e) {} }
  player.id = null; player.phase = "entry"; player.sendState = "idle"; player.elapsedMs = null;
  sessionStorage.removeItem(SS_KEY);
  renderedPhase = "";
  renderPlayer();
}

function markFled() {
  if (player.phase !== "running") return;
  stopWander();
  player.phase = "fled";
  player.elapsedMs = null;
  saveSession();
  sfx.curse(); buzz(80);
  renderPlayer();
  tryBeacon(true, player.id, null, player.targetSec);
  sendResult(true);
}

async function sendResult(dq) {
  if (!player.id) return;
  if (player.sendState === "sent" || player.sendState === "sending") return;
  player.sendState = "sending";
  saveSession();
  if (!dq) await sleep(Math.random() * 1500);
  if (player.sendState === "sent") return;
  var payload = {
    action: "submit", id: player.id, dq: dq ? "1" : "0",
    elapsedMs: dq ? "" : Math.round(Number(player.elapsedMs)),
    targetSec: player.targetSec
  };
  var ok = false;
  for (var i = 0; i < 5; i++) {
    try {
      var r = await api(payload);
      if (r && r.ok) { ok = true; break; }
    } catch (e) {}
    await sleep(700 * (i + 1));
  }
  if (ok) {
    player.sendState = "sent";
    saveSession();
    paintSendNote("", false);
  } else {
    player.sendState = "idle";
    saveSession();
    paintSendNote("おくれなかった", true);
  }
}

/* ---------- 発表 ---------- */
function fmtSec(ms) { return (Number(ms) / 1000).toFixed(3) + "びょう"; }
function fmtErr(ms) {
  var n = Number(ms);
  if (!n) return "±0.000びょう";
  var body = (n / 1000).toFixed(3);
  return (n > 0 ? "+" : "") + body + "びょう";
}
function placeName(rank, total) {
  if (total <= 1) return "1位";
  if (rank === total) return "ドベ";
  if (rank === total - 1) return "ブービー";
  return rank + "位";
}
function flavor(p, total) {
  var a = Math.abs(p.errorMs) / 1000;
  if (p.rank === total && total > 1) return "いちばん はなれた";
  if (a < 0.5) return "ほぼ ぴったり！";
  if (p.rank === 1) return "いちばん ちかい！";
  if (a < 1) return "かなり ちかい";
  if (a < 2) return "すこし ずれた";
  if (a < 4) return "だいぶ ずれた";
  return "大きく ずれた";
}
function blessed(p, total) {
  if (p.rank === total) return false;
  if (p.rank === 1) return true;
  return Math.abs(p.errorMs) < 1000;
}
function buildRanking(list) {
  var done = list.filter(function (p) {
    return p.status === "done" && p.elapsedMs != null && isFinite(Number(p.elapsedMs));
  }).map(function (p) { return Object.assign({}, p); });
  done.forEach(function (p) {
    p.elapsedMs = Number(p.elapsedMs);
    p.targetSec = Number(p.targetSec) || 15;
    p.errorMs = isFinite(Number(p.errorMs)) ? Number(p.errorMs) : p.elapsedMs - p.targetSec * 1000;
    p.absErrorMs = Math.abs(p.errorMs);
    p.finishedAt = Number(p.finishedAt) || 0;
    p.createdAt = Number(p.createdAt) || 0;
  });
  done.sort(function (a, b) {
    return a.absErrorMs - b.absErrorMs || a.finishedAt - b.finishedAt || a.createdAt - b.createdAt;
  });
  var total = done.length;
  done.forEach(function (p, i) { p.rank = i + 1; p.place = placeName(i + 1, total); });
  var steps = [];
  var winner = total >= 1 ? done[0] : null;
  var dobe = total >= 2 ? done[total - 1] : null;
  if (total >= 3) {
    for (var rank = total - 1; rank >= 2; rank--) steps.push({ kind: "one", p: done[rank - 1] });
  }
  if (winner && dobe) {
    var pair = Math.random() < 0.5 ? [winner, dobe] : [dobe, winner];
    steps.push({ kind: "versus", pair: pair });
    steps.push({ kind: "one", p: dobe });
  }
  if (winner) steps.push({ kind: "one", p: winner });
  if (total >= 1) steps.push({ kind: "board" });
  return { done: done, steps: steps, total: total };
}
function titleOf(p) {
  if (p.rank === 1) return "優勝";
  return p.place;
}
function miniHtml(p, total) {
  var bad = p.rank === total || Math.abs(p.errorMs) >= 1500;
  var num = bad ? "bad" : "g";
  var ch = charBy(p.charId);
  var mark = p.place.length >= 4 ? " long" : "";
  if (bad) mark += " bad";
  return wnd("", '<div class="who mini"><div class="rankmark' + mark + '">' + esc(p.place) + "</div>" + svgOf(ch, 32) +
    '<div><div class="pname">' + esc(p.name) + '</div><div class="num ' + num + '">' + fmtErr(p.errorMs) + "</div></div></div>");
}
function boardCard(p, total, feature) {
  var ch = charBy(p.charId);
  var bad = p.rank === total && total > 1;
  var mark = p.place.length >= 4 ? " long" : "";
  if (bad) mark += " bad";
  var frame = feature ? (p.rank === 1 ? "gold" : "red") : "";
  var detail = feature
    ? '<div class="num ' + (bad ? "bad" : "g") + '">' + fmtErr(p.errorMs) + "</div>"
    : "";
  return wnd("", '<div class="who">' +
    '<div class="rankmark' + mark + '">' + esc(p.place) + "</div>" +
    svgOf(ch, feature ? 96 : 48) +
    '<div><div class="pname">' + esc(p.name) + "</div>" + detail + "</div></div>", frame);
}
function cardHtml(p, total, big, extra) {
  var cls = [];
  if (extra) cls.push(extra);
  if (p.rank === 1) cls.push("gold");
  else if (p.rank === total) cls.push("red");
  var bad = p.rank === total || Math.abs(p.errorMs) >= 1500;
  var num = bad ? "bad" : "g";
  var ch = charBy(p.charId);
  return wnd(esc(p.place), '<div class="who' + (big ? " big" : "") + '">' + svgOf(ch, big ? 112 : 56) +
    '<div><div class="pname">' + esc(p.name) + '</div><div class="job">' + esc(ch.name) + "</div>" +
    '<div>じかん <span class="num ' + num + '">' + fmtSec(p.elapsedMs) + "</span></div>" +
    '<div>ごさ <span class="num ' + num + '">' + fmtErr(p.errorMs) + "</span></div>" +
    '<div class="' + num + '">' + esc(flavor(p, total)) + "</div></div></div>", cls.join(" "));
}

var typeToken = 0;
async function typeInto(el, text) {
  if (!el) return;
  var token = ++typeToken;
  el.textContent = "";
  var chars = Array.from(text);
  for (var i = 0; i < chars.length; i++) {
    if (token !== typeToken) return;
    el.textContent += chars[i];
    if (chars[i] !== "\n") await sleep(26);
  }
}

function paintParty() {

    else box.innerHTML = list.map(function (p) {

    }).join("");

function fitParty() {
  var box = document.getElementById("party");
  if (!box || state.mode === "results") return;
  var n = box.querySelectorAll(":scope > .wnd").length;
  var w = box.clientWidth;
  var h = box.clientHeight;
  if (!n || w < 40 || h < 80) {
    box.style.gridTemplateColumns = "";
    box.style.gridTemplateRows = "";
    box.classList.remove("dense");
    return;
  }
  var gap = 8;
  var cols = Math.max(1, Math.min(n, Math.floor((w + gap) / 168)));
  var rows = Math.ceil(n / cols);
  var rowH = Math.floor((h - (rows - 1) * gap) / rows);
  while (rowH < 40 && cols < n) {
    var nextCols = cols + 1;
    var nextW = Math.floor((w - (nextCols - 1) * gap) / nextCols);
    if (nextW < 96) break;
    cols = nextCols;
    rows = Math.ceil(n / cols);
    rowH = Math.floor((h - (rows - 1) * gap) / rows);
  }
  if (rowH > 84) rowH = 84;
  if (rowH < 30) rowH = 30;
  box.classList.toggle("dense", rowH < 58);
  box.style.gridTemplateColumns = "repeat(" + cols + ", minmax(0, 1fr))";
  box.style.gridTemplateRows = "repeat(" + rows + ", " + rowH + "px)";
}

async function bump(d) {
  var n = Math.max(10, Math.min(30, state.target + d));
  sfx.pip();
  if (n === state.target) return;
  await withAdmin(async function () {
    state.target = n;
    paintTarget();
    await api({ action: "setTarget", targetSec: n });
    await poll();
  });
}
async function withAdmin(fn) {
  if (adminBusy) return;
  adminBusy = true;
  try { await fn(); } finally { adminBusy = false; }
}
async function poll() {
  if (polling) return;
  polling = true;
  try {
    var data = await api({ action: "list" });
    if (!data || !data.ok) throw new Error("bad");
    state.online = true;
    state.players = Array.isArray(data.players) ? data.players : [];
    if (data.targetSec >= 10 && data.targetSec <= 30) state.target = data.targetSec;
    if (state.mode === "results") { paintConn(); paintLate(); paintTarget(); }
    else { paintTarget(); paintParty(); paintConn(); }
  } catch (e) {
    state.online = false;
    paintConn();
  } finally { polling = false; }
}

function startResults() {
  var snap = state.players.map(function (p) { return Object.assign({}, p); });
  var built = buildRanking(snap);
  var fled = snap.filter(function (p) { return p.status === "fled"; }).length;
  show = {
    ranking: built.done, steps: built.steps, total: built.total, gen: 1,
    index: 0, done: false, busy: false, fled: fled, target: state.target, snapDone: built.total,
    revealed: [], holding: null, centerMode: ""
  };
  state.mode = "results";
  var intro = built.total ? "けっかはっぴょう" : "まだ誰も止めていない";
  app.innerHTML = '<div class="screen result-screen">' + eventTitle() +
    '<p class="sub">目標 <span id="resTarget" class="g">' + show.target + 'びょう</span></p>' +
    '<p id="conn" class="bad center"></p>' +
    '<div class="reveal"><div id="history" class="history"></div><div class="stage-mid"><div id="spot" class="spot"></div><div class="announce" id="msg"></div></div></div>' +
    '<button type="button" id="nextBtn" class="sr" tabindex="-1" aria-hidden="true"></button></div>';
  document.getElementById("nextBtn").onclick = nextReveal;
  paintConn();
  paintNext();
  if (!built.total) document.getElementById("nextBtn").disabled = true;
  typeInto(document.getElementById("msg"), intro);
}

function paintNext() {
  var label = document.getElementById("nextLabel");
  var btn = document.getElementById("nextBtn");
  var left = document.getElementById("left");
  if (!show || !btn) return;
  btn.disabled = !!show.busy;
  if (label) label.textContent = show.done ? "もういちど はっぴょう" : "つぎを はっぴょう";
  if (left) {
    if (!show.total) left.textContent = "";
    else if (show.done) left.textContent = "はっぴょう おわり";
    else left.textContent = "のこり " + (show.steps.length - show.index) + "かい";
  }
}
function paintLate() {
  var el = document.getElementById("late");
  if (!el || !show) return;
  var now = state.players.filter(function (p) { return p.status === "done"; }).length;
  el.textContent = now > show.snapDone ? "新しい結果が来た" : "";
}

function showAlive(gen) { return !!(show && show.gen === gen); }

function leaveResults() {
  typeToken++;
  if (show) show.gen++;
  show = null;
  renderDisplay(false);
  poll();
}

async function nextReveal() {
  if (!show || show.busy || show.done) return;
  if (show.index >= show.steps.length) return;
  typeToken++;
  var gen = show.gen;
  var step = show.steps[show.index];
  show.busy = true;
  try {
    if (step.kind === "versus") {
      show.holding = null;
      show.centerMode = "versus";
      paintHistory();
      paintVersus(step.pair);
      show.index++;
    } else if (step.kind === "board") {
      show.centerMode = "board";
      paintBoard();
      show.index++;
      show.done = true;
    } else if (step.p) {
      var person = step.p;
      var same = show.centerMode === "title" && show.holding && show.holding.id === person.id;
      if (!same) {
        show.holding = person;
        show.centerMode = "title";
        paintHistory();
        paintCenter(person, "title");
        if (show.total > 1 && person.rank === show.total) flashWhite();
      } else {
        show.revealed.push(person);
        show.centerMode = "name";
        show.index++;
        paintHistory();
        paintCenter(person, "name");
      }
    }
  } finally {
    if (showAlive(gen)) show.busy = false;
  }
}

function paintHistory() {
  var history = document.getElementById("history");
  if (!history || !show) return;
  var list = show.revealed.slice().sort(function (a, b) { return a.rank - b.rank; });
  history.innerHTML = list.map(function (p) { return miniHtml(p, show.total); }).join("");
}
function setStage(mode) {
  var mid = document.querySelector(".stage-mid");
  if (mid) {
    mid.classList.toggle("versus-on", mode === "versus");
    mid.classList.toggle("board-on", mode === "board");
  }
  var spot = document.getElementById("spot");
  if (spot && mode !== "versus") spot.style.width = "";
}
function paintCenter(p, mode) {
  var spot = document.getElementById("spot");
  var msg = document.getElementById("msg");
  if (!spot || !msg || !p) return;
  setStage("");
  var finale = p.rank === 1 ? " win" : show.total > 1 && p.rank === show.total ? " dobe" : "";
  if (mode === "title") {
    spot.innerHTML = "";
    msg.className = "announce place" + finale;
    msg.textContent = titleOf(p);
    return;
  }
  spot.innerHTML = cardHtml(p, show.total, true, "now");
  msg.className = "announce name" + finale;
  msg.textContent = p.name;
}
function mysteryHtml(p) {
  var ch = charBy(p.charId);
  return wnd("", '<div class="who"><div class="rankmark">？</div>' + svgOf(ch, 72) +
    '<div><div class="pname">' + esc(p.name) + "</div></div></div>");
}
function paintVersus(pair) {
  var spot = document.getElementById("spot");
  var msg = document.getElementById("msg");
  if (!spot || !msg) return;
  setStage("versus");
  spot.innerHTML = '<div class="versus">' + pair.map(mysteryHtml).join("") + "</div>";
  msg.className = "announce place";
  msg.innerHTML = "優勝 or ドベ";
}
function paintBoard() {
  var spot = document.getElementById("spot");
  var msg = document.getElementById("msg");
  var history = document.getElementById("history");
  if (history) history.innerHTML = "";
  if (msg) { msg.className = "announce"; msg.textContent = ""; }
  if (!spot || !show) return;
  setStage("board");
  spot.style.width = "100%";
  var list = show.ranking.slice().sort(function (a, b) { return a.rank - b.rank; });
  spot.innerHTML = '<div class="final">' + list.map(function (p) {
    var feature = p.rank === 1 || (show.total > 1 && p.rank === show.total);
    return '<div class="' + (feature ? "feature" : "plain") + '">' + boardCard(p, show.total, feature) + "</div>";
  }).join("") + "</div>";
}
function flashWhite() {
  document.body.classList.add("flash");
  setTimeout(function () { document.body.classList.remove("flash"); }, 140);
}
function replayShow() {
  if (!show) return;
  show.index = 0; show.done = false; show.busy = false; show.revealed = [];
  show.holding = null; show.centerMode = "";
  paintHistory();
  var spot = document.getElementById("spot");
  if (spot) spot.innerHTML = "";
  var msg = document.getElementById("msg");
  if (msg) { msg.className = "announce"; msg.textContent = ""; }
  var intro = show.total ? "けっかはっぴょう" : "まだ誰も止めていない";
  typeInto(msg, intro);
}

document.addEventListener("keydown", function (e) {
  if (!isAdmin && player.phase === "entry" && document.getElementById("grid")) {
    if (document.activeElement && document.activeElement.id === "name") return;
    var delta = e.key === "ArrowLeft" ? -1 : e.key === "ArrowRight" ? 1 : e.key === "ArrowUp" ? -4 : e.key === "ArrowDown" ? 4 : 0;
    if (!delta) return;
    e.preventDefault();
    pickChar((selected + delta + 20) % 20);
    return;
  }
  if (!isAdmin) return;
  if (e.key === "Escape") {
    if (document.fullscreenElement) return;
    if (state.mode === "results") { e.preventDefault(); leaveResults(); }
    else if (state.mode === "lobby") { e.preventDefault(); renderSetup(); }
    return;
  }
  if (state.mode === "results" && (e.key === "Enter" || e.key === "ArrowRight" || e.key === " ")) {
    var next = document.getElementById("nextBtn");
    if (!next || next.disabled) return;
    e.preventDefault();
    next.click();
  }
});

/* ---------- 起動 ---------- */
function bootPlayer() {
  document.title = "エントリー";
  restore();
  if (player.sendState === "sending") player.sendState = "idle";
  var lostClock = player.phase === "running";
  if (lostClock) { player.phase = "fled"; player.elapsedMs = null; saveSession(); }
  if (player.phase === "wait") player.phase = "ready";
  renderPlayer();
  armVisibility();
  startTargetPoll();
  if (lostClock) sendResult(true);
  else if ((player.phase === "done" || player.phase === "fled") && player.sendState !== "sent") sendResult(player.phase === "fled");
  else if (player.phase === "joined" || player.phase === "ready") refreshTarget();
}

if (isAdmin) bootAdmin();
else bootPlayer();
</script>
</body>
